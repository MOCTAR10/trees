services:
  db:
    build: ./db
    container_name: forestry_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forestry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestry_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forestry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forestry_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migrations/002_circular_economy.sql:/docker-entrypoint-initdb.d/02_circular_economy.sql:ro
      - ./db/migrations/003_hybrid_search.sql:/docker-entrypoint-initdb.d/03_hybrid_search.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forestry} -d ${POSTGRES_DB:-forestry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend-python
    container_name: forestry_fastapi
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forestry}:${POSTGRES_PASSWORD:-forestry_secret}@db:5432/${POSTGRES_DB:-forestry}
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot corpus loader. Opt-in via `docker compose --profile tools run --rm ingest`
  # (or `docker compose --profile tools up ingest`); never started by default `up`,
  # so CI boot + smoke stack stay light.
  ingest:
    build: ./backend-python
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forestry}:${POSTGRES_PASSWORD:-forestry_secret}@db:5432/${POSTGRES_DB:-forestry}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./backend-python:/app
      - forestry_hf_cache:/app/.cache/huggingface
    command: python -m ingestion.ingest

  gateway:
    build: ./backend-node
    container_name: forestry_gateway
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      FASTAPI_URL: http://api:8000
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  forestry_pgdata:
  forestry_hf_cache:
