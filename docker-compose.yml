services:
  db:
    build: ./db
    container_name: forestry_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forestry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forestry_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forestry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forestry_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migrations/002_circular_economy.sql:/docker-entrypoint-initdb.d/02_circular_economy.sql:ro
      - ./db/migrations/003_hybrid_search.sql:/docker-entrypoint-initdb.d/03_hybrid_search.sql:ro
      - ./db/migrations/004_rbac.sql:/docker-entrypoint-initdb.d/04_rbac.sql:ro
      - ./db/migrations/005_multi_view_images.sql:/docker-entrypoint-initdb.d/05_multi_view_images.sql:ro
      - ./db/migrations/006_scan_health.sql:/docker-entrypoint-initdb.d/06_scan_health.sql:ro
      - ./db/migrations/007_projects.sql:/docker-entrypoint-initdb.d/07_projects.sql:ro
      - ./db/migrations/008_abattage.sql:/docker-entrypoint-initdb.d/08_abattage.sql:ro
      - ./db/migrations/009_gouvernance.sql:/docker-entrypoint-initdb.d/09_gouvernance.sql:ro
      - ./db/migrations/010_traceability.sql:/docker-entrypoint-initdb.d/10_traceability.sql:ro
      - ./db/migrations/011_slice5.sql:/docker-entrypoint-initdb.d/11_slice5.sql:ro
      - ./db/migrations/012_slice6.sql:/docker-entrypoint-initdb.d/12_slice6.sql:ro
      - ./db/migrations/013_slice7.sql:/docker-entrypoint-initdb.d/13_slice7.sql:ro
      - ./db/migrations/014_slice8.sql:/docker-entrypoint-initdb.d/14_slice8.sql:ro
      - ./db/migrations/015_slice9.sql:/docker-entrypoint-initdb.d/15_slice9.sql:ro
      - ./db/migrations/016_slice10.sql:/docker-entrypoint-initdb.d/16_slice10.sql:ro
      - ./db/migrations/017_slice11.sql:/docker-entrypoint-initdb.d/17_slice11.sql:ro
      - ./db/migrations/018_slice12.sql:/docker-entrypoint-initdb.d/18_slice12.sql:ro
      - ./db/migrations/019_slice13.sql:/docker-entrypoint-initdb.d/19_slice13.sql:ro
      - ./db/migrations/020_slice14.sql:/docker-entrypoint-initdb.d/20_slice14.sql:ro
      - ./db/migrations/021_slice15.sql:/docker-entrypoint-initdb.d/21_slice15.sql:ro
      - ./db/migrations/022_slice16.sql:/docker-entrypoint-initdb.d/22_slice16.sql:ro
      - ./db/migrations/023_slice18.sql:/docker-entrypoint-initdb.d/23_slice18.sql:ro
      - ./db/migrations/024_slice19.sql:/docker-entrypoint-initdb.d/24_slice19.sql:ro
      - ./db/migrations/025_slice20.sql:/docker-entrypoint-initdb.d/25_slice20.sql:ro
      - ./db/migrations/026_slice21.sql:/docker-entrypoint-initdb.d/26_slice21.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forestry} -d ${POSTGRES_DB:-forestry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend-python
    container_name: forestry_fastapi
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forestry}:${POSTGRES_PASSWORD:-forestry_secret}@db:5432/${POSTGRES_DB:-forestry}
      HF_HOME: /models/huggingface
      SCAN_MEDIA_DIR: /media/scans
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
      - forestry_hf_cache:/models/huggingface
      - forestry_scan_media:/media/scans
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot corpus loader. Opt-in via `docker compose --profile tools run --rm ingest`
  # (or `docker compose --profile tools up ingest`); never started by default `up`,
  # so CI boot + smoke stack stay light.
  ingest:
    build: ./backend-python
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forestry}:${POSTGRES_PASSWORD:-forestry_secret}@db:5432/${POSTGRES_DB:-forestry}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./backend-python:/app
      - forestry_hf_cache:/app/.cache/huggingface
    command: python -m ingestion.ingest

  gateway:
    build: ./backend-node
    container_name: forestry_gateway
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      FASTAPI_URL: http://api:8000
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  forestry_pgdata:
  forestry_hf_cache:
  forestry_scan_media:
