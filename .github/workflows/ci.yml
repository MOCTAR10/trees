name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; superseded PR pushes cancel their predecessors.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.16.10"
          # ultralytics pulls the GUI build of opencv; keep only headless.
          pip uninstall -y opencv-python || true
          pip install --force-reinstall --no-deps "opencv-python-headless==5.0.0.93"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Unit tests (pytest)
        run: pytest tests -q

  # ─────────────────────────────────────────────────────────────
  gateway:
    name: Gateway · syntax + node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js

      - name: Auth + rate-limit tests
        run: npm test

  # ─────────────────────────────────────────────────────────────
  mobile:
    name: Mobile · TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Builds all three images, boots the real compose stack and runs the
  # secret-free smoke test. This is what catches runtime-only regressions
  # (e.g. a container that builds but crashes on import because cv2 is missing).
  stack:
    name: Stack · build + boot + smoke
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      COMPOSE_PROJECT_NAME: trees
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build db image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          load: true
          tags: trees-db:latest
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          load: true
          tags: trees-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-node
          load: true
          tags: trees-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install smoke deps
        run: pip install "httpx==0.28.1"

      - name: Boot stack (wait for healthy)
        run: |
          cp .env.example .env
          export REQUIRE_API_KEY=true
          export API_KEY=ci-smoke-key-41bb1f4e
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose ps

      - name: Smoke test (API-key mode)
        run: |
          REQUIRE_API_KEY=true SMOKE_API_KEY=ci-smoke-key-41bb1f4e \
            python backend-python/scripts/smoke_stack.py

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=120

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────
  # Single required status check for branch protection.
  ci-success:
    name: CI · success
    runs-on: ubuntu-latest
    needs: [backend, gateway, mobile, stack]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          echo "backend = ${{ needs.backend.result }}"
          echo "gateway = ${{ needs.gateway.result }}"
          echo "mobile  = ${{ needs.mobile.result }}"
          echo "stack   = ${{ needs.stack.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.gateway.result }}" != "success" ] \
            || [ "${{ needs.mobile.result }}" != "success" ] \
            || [ "${{ needs.stack.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All required jobs passed ✅"
