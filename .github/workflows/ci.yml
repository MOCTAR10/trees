name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; superseded PR pushes cancel their predecessors.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.16.10"
          # ultralytics pulls the GUI build of opencv; keep only headless.
          pip uninstall -y opencv-python || true
          pip install --force-reinstall --no-deps "opencv-python-headless==5.0.0.93"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Unit tests (pytest)
        run: pytest tests -q

  # ─────────────────────────────────────────────────────────────
  gateway:
    name: Gateway · syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js

  # ─────────────────────────────────────────────────────────────
  mobile:
    name: Mobile · TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, gateway]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          push: false
          tags: forestry-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-node
          push: false
          tags: forestry-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  # ─────────────────────────────────────────────────────────────
  # Single required status check for branch protection.
  ci-success:
    name: CI · success
    runs-on: ubuntu-latest
    needs: [backend, gateway, mobile]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          echo "backend = ${{ needs.backend.result }}"
          echo "gateway = ${{ needs.gateway.result }}"
          echo "mobile  = ${{ needs.mobile.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.gateway.result }}" != "success" ] \
            || [ "${{ needs.mobile.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All required jobs passed ✅"
