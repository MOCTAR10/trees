# Web app (Ministère, Entreprise). Template: __DOMAIN__ and __API_KEY__ replaced by
# deploy/web/setup.sh. /api is forwarded to the gateway with the key added here, so
# the key never ships in the JavaScript bundle; the user's login still guards every call.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/trees-web;
    index index.html;
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "__API_KEY__";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Connection badge of the app: answered by the gateway, not by index.html.
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /_expo/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
