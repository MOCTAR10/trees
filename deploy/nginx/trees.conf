# Foresterie Numérique — public entry (TLS added by certbot on first deploy).
# Template: __DOMAIN__ is replaced by deploy/server_setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Scans upload several full-resolution photos.
    client_max_body_size 60m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI measurement (SAM 2.1 + depth) can take a while on CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
