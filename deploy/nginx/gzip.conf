# Compression for every Foresterie site (JS bundle 4.3 MB → ~1 MB): the route from
# Gabon to the server is slow, so every byte saved counts. Installed in /etc/nginx/conf.d/
# (`gzip on` is already in the stock nginx.conf: repeating it is an error).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml
           image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
